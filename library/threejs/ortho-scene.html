<!DOCTYPE html>
<!--
  library/threejs/ortho-scene.html — Three.js orthographic 2D stick figure scene.
  Demonstrates deterministic seeking with Three.js WebGLRenderer.
-->
<html>
<head>
<meta charset="utf-8">
<title>Three.js Orthographic Stickman</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; overflow: hidden; }
  canvas { display: block; width: 100vmin; height: 100vmin; margin: 0 auto; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';
import { StickmanThree } from './stickman-three.js';
import { POSES, blendPose } from '../js/rig.js';

const width = 960, height = 960;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4efe6);

const camera = new THREE.OrthographicCamera(-width / 2, width / 2, height / 2, -height / 2, 0.1, 1000);
camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(width, height);
document.body.appendChild(renderer.domElement);

const stickman = new StickmanThree({ height: 320, color: 0x1c1c1c, strokeWidth: 7 });
stickman.group.position.set(0, -150, 0);
scene.add(stickman.group);

function drawFrame(frame) {
  const u = (frame % 60) / 60;
  const pose = blendPose(POSES.neutral, POSES.wave, Math.sin(u * Math.PI));
  stickman.update(pose);
  renderer.render(scene, camera);
}

window.__seek = (frame) => drawFrame(frame);
window.__ready = () => new Promise((resolve) => {
  drawFrame(0);
  resolve();
});
</script>
</body>
</html>
